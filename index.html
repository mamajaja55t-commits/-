<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Hiro - สัตว์และยานอวกาศ</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js สำหรับ A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #000;
    }

    #ui {
      position: fixed;
      z-index: 9999;
      left: 0;
      right: 0;
      bottom: 20px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    #runButton {
      pointer-events: auto;
      border: 0;
      border-radius: 18px;
      padding: 14px 30px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: #1677ff;
      box-shadow: 0 5px 18px rgba(0,0,0,.35);
      cursor: pointer;
      touch-action: manipulation;
    }

    #runButton:active {
      transform: scale(.96);
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 15px;
      border-radius: 14px;
      color: white;
      background: rgba(0,0,0,.55);
      font-size: 15px;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="status">กำลังรอ Hiro marker...</div>

  <div id="ui">
    <button id="runButton">🏃 วิ่ง</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- โมเดลพื้นฐานสร้างจาก A-Frame primitives จึงไม่ต้องดาวน์โหลดไฟล์โมเดลเพิ่ม -->
    </a-assets>

    <!-- Hiro marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- กลุ่มสัตว์ -->
      <a-entity id="animals" position="0 0 0">

        <!-- ควาย -->
        <a-entity id="buffalo" position="-0.9 0 0">
          <a-box position="0 0.55 0" scale="0.75 0.5 0.45" color="#4b3024"></a-box>
          <a-sphere position="0 0.95 0" radius="0.28" color="#3b241b"></a-sphere>
          <a-box position="-0.18 0.92 0" scale="0.08 0.05 0.05" color="#fff"></a-box>
          <a-box position="0.18 0.92 0" scale="0.08 0.05 0.05" color="#fff"></a-box>
          <a-cylinder position="-0.25 0.25 0.16" radius="0.08" height="0.45" color="#3b241b"></a-cylinder>
          <a-cylinder position="0.25 0.25 0.16" radius="0.08" height="0.45" color="#3b241b"></a-cylinder>
          <a-cone position="-0.25 1.16 0" radius-bottom="0.16" radius-top="0" height="0.35" rotation="0 0 55" color="#e8d2a5"></a-cone>
          <a-cone position="0.25 1.16 0" radius-bottom="0.16" radius-top="0" height="0.35" rotation="0 0 -55" color="#e8d2a5"></a-cone>
          <a-text value="ควาย" align="center" position="0 1.45 0" scale=".8 .8 .8" color="#fff"></a-text>
        </a-entity>

        <!-- ช้าง -->
        <a-entity id="elephant" position="0 0 0">
          <a-sphere position="0 0.72 0" scale=".48 .48 .42" color="#888"></a-sphere>
          <a-sphere position="0 1.12 0" radius=".3" color="#999"></a-sphere>
          <a-sphere position="-.29 1.12 0" scale=".18 .3 .08" color="#aaa"></a-sphere>
          <a-sphere position=".29 1.12 0" scale=".18 .3 .08" color="#aaa"></a-sphere>
          <a-cylinder position="0 .92 -.27" rotation="90 0 0" radius=".08" height=".5" color="#888"></a-cylinder>
          <a-cylinder position="-.28 .32 .12" radius=".09" height=".5" color="#777"></a-cylinder>
          <a-cylinder position=".28 .32 .12" radius=".09" height=".5" color="#777"></a-cylinder>
          <a-text value="ช้าง" align="center" position="0 1.52 0" scale=".8 .8 .8" color="#fff"></a-text>
        </a-entity>

        <!-- ม้า -->
        <a-entity id="horse" position=".9 0 0">
          <a-box position="0 .65 0" scale=".62 .38 .32" color="#9b5a2e"></a-box>
          <a-box position=".28 1.0 0" scale=".22 .55 .25" rotation="0 0 -12" color="#9b5a2e"></a-box>
          <a-cone position=".29 1.35 0" radius-bottom=".18" radius-top=".1" height=".35" color="#9b5a2e"></a-cone>
          <a-cylinder position="-.2 .2 .12" radius=".055" height=".7" color="#633719"></a-cylinder>
          <a-cylinder position=".2 .2 .12" radius=".055" height=".7" color="#633719"></a-cylinder>
          <a-cylinder position="-.2 .2 -.12" radius=".055" height=".7" color="#633719"></a-cylinder>
          <a-cylinder position=".2 .2 -.12" radius=".055" height=".7" color="#633719"></a-cylinder>
          <a-text value="ม้า" align="center" position="0 1.62 0" scale=".8 .8 .8" color="#fff"></a-text>
        </a-entity>

        <!-- วัว -->
        <a-entity id="cow" position="-0.9 0 -1">
          <a-box position="0 .55 0" scale=".65 .45 .42" color="#f5f0df"></a-box>
          <a-sphere position="0 .95 0" radius=".25" color="#f5f0df"></a-sphere>
          <a-sphere position="-.1 .98 -.22" radius=".045" color="#111"></a-sphere>
          <a-sphere position=".1 .98 -.22" radius=".045" color="#111"></a-sphere>
          <a-cone position="-.16 1.18 0" radius-bottom=".09" radius-top="0" height=".2" color="#d8bfa0"></a-cone>
          <a-cone position=".16 1.18 0" radius-bottom=".09" radius-top="0" height=".2" color="#d8bfa0"></a-cone>
          <a-cylinder position="-.2 .2 .12" radius=".055" height=".5" color="#555"></a-cylinder>
          <a-cylinder position=".2 .2 .12" radius=".055" height=".5" color="#555"></a-cylinder>
          <a-text value="วัว" align="center" position="0 1.38 0" scale=".75 .75 .75" color="#fff"></a-text>
        </a-entity>

        <!-- หมู -->
        <a-entity id="pig" position=".9 0 -1">
          <a-sphere position="0 .6 0" scale=".48 .36 .38" color="#f5a6b8"></a-sphere>
          <a-sphere position="0 .93 0" radius=".27" color="#f7adbd"></a-sphere>
          <a-sphere position="-.12 1.0 -.23" radius=".04" color="#222"></a-sphere>
          <a-sphere position=".12 1.0 -.23" radius=".04" color="#222"></a-sphere>
          <a-torus position="0 .91 -.27" radius=".1" radius-tubular=".035" rotation="90 0 0" color="#d77f95"></a-torus>
          <a-cylinder position="-.2 .28 .12" radius=".055" height=".35" color="#d98da0"></a-cylinder>
          <a-cylinder position=".2 .28 .12" radius=".055" height=".35" color="#d98da0"></a-cylinder>
          <a-text value="หมู" align="center" position="0 1.36 0" scale=".75 .75 .75" color="#fff"></a-text>
        </a-entity>

        <!-- ยานอวกาศ -->
        <a-entity id="spaceship" position="0 .05 -1.9">
          <a-sphere position="0 .65 0" scale=".65 .18 .38" color="#d7dce3"></a-sphere>
          <a-cone position="0 .82 0" radius-bottom=".25" radius-top=".05" height=".42" color="#9bdcff"></a-cone>
          <a-cylinder position="0 .45 0" radius=".13" height=".25" color="#555"></a-cylinder>
          <a-cone position="-.4 .25 0" radius-bottom=".12" radius-top="0" height=".35" rotation="0 0 -90" color="#ff9d2e"></a-cone>
          <a-cone position=".4 .25 0" radius-bottom=".12" radius-top="0" height=".35" rotation="0 0 90" color="#ff9d2e"></a-cone>
          <a-text value="ยานอวกาศ" align="center" position="0 1.18 0" scale=".75 .75 .75" color="#fff"></a-text>
        </a-entity>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector('#hiroMarker');
    const status = document.querySelector('#status');
    const runButton = document.querySelector('#runButton');

    let markerVisible = false;
    let running = false;
    let animationTimer = null;

    marker.addEventListener('markerFound', () => {
      markerVisible = true;
      status.textContent = 'พบ Hiro marker แล้ว! 🎉';
    });

    marker.addEventListener('markerLost', () => {
      markerVisible = false;
      status.textContent = 'กำลังรอ Hiro marker...';
      stopRun();
    });

    function runAnimals() {
      if (!markerVisible) {
        status.textContent = 'กรุณาส่องกล้องไปที่ Hiro marker ก่อน';
        setTimeout(() => {
          if (!markerVisible) status.textContent = 'กำลังรอ Hiro marker...';
        }, 1800);
        return;
      }

      if (running) {
        stopRun();
        return;
      }

      running = true;
      runButton.textContent = '⏹ หยุด';
      status.textContent = 'สัตว์กำลังวิ่ง! 🏃🐘🐎🐄🐖';

      const ids = ['buffalo', 'elephant', 'horse', 'cow', 'pig', 'spaceship'];
      const entities = ids.map(id => document.querySelector('#' + id));

      let start = null;

      function animate(time) {
        if (!running) return;
        if (!start) start = time;

        const t = (time - start) / 1000;

        entities.forEach((el, i) => {
          const base = el.getAttribute('position');
          const direction = i % 2 === 0 ? 1 : -1;
          const x = base.x + Math.sin(t * 5 + i) * 0.22;
          const y = base.y + Math.abs(Math.sin(t * 10 + i)) * 0.10;
          const z = base.z + Math.sin(t * 3 + i) * 0.08;

          el.setAttribute('position', { x, y, z });
          el.setAttribute('rotation', {
            x: 0,
            y: Math.sin(t * 4 + i) * 12 * direction,
            z: Math.sin(t * 10 + i) * 3
          });
        });

        animationTimer = requestAnimationFrame(animate);
      }

      animationTimer = requestAnimationFrame(animate);
    }

    function stopRun() {
      running = false;
      if (animationTimer) cancelAnimationFrame(animationTimer);
      animationTimer = null;
      runButton.textContent = '🏃 วิ่ง';
    }

    runButton.addEventListener('click', runAnimals);
  </script>
</body>
</html>
